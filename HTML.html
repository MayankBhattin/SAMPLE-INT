<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Hand Universe</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #03030a;
        font-family: Inter, system-ui, sans-serif;
    }

    body {
        position: relative;
        color: white;
    }

    #camera {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
        opacity: 0.10;
        filter: saturate(1.5) contrast(1.15);
    }

    #canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
    }

    .vignette {
        position: fixed;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background:
            radial-gradient(
                circle at 50% 45%,
                transparent 0%,
                rgba(0,0,0,0.08) 45%,
                rgba(0,0,0,0.72) 100%
            );
    }

    .topbar {
        position: fixed;
        top: 24px;
        left: 28px;
        right: 28px;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
    }

    .brand {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        opacity: 0.9;
    }

    .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.75;
    }

    .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ff4dce;
        box-shadow: 0 0 15px #ff4dce;
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(0.8); opacity: 0.5; }
        50% { transform: scale(1.2); opacity: 1; }
    }

    .instructions {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        z-index: 10;

        padding: 13px 18px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 999px;

        background: rgba(10, 8, 22, 0.48);
        backdrop-filter: blur(16px);

        color: rgba(255,255,255,0.75);
        font-size: 11px;
        letter-spacing: 0.08em;
        white-space: nowrap;

        box-shadow:
            0 10px 40px rgba(0,0,0,0.35),
            inset 0 0 20px rgba(255,255,255,0.025);
    }

    .start {
        position: fixed;
        inset: 0;
        z-index: 30;

        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 20px;

        background:
            radial-gradient(circle at 50% 50%,
                rgba(80, 30, 130, 0.28),
                transparent 35%),
            #03030a;

        transition: opacity .5s ease;
    }

    .start.hidden {
        opacity: 0;
        pointer-events: none;
    }

    .start h1 {
        font-size: clamp(38px, 8vw, 90px);
        line-height: 0.9;
        letter-spacing: -0.07em;
        text-align: center;

        background: linear-gradient(
            90deg,
            #fff,
            #9d7cff,
            #ff4dcc,
            #fff
        );

        background-size: 300%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;

        animation: gradientMove 5s linear infinite;
    }

    @keyframes gradientMove {
        from { background-position: 0%; }
        to { background-position: 300%; }
    }

    .start p {
        max-width: 520px;
        text-align: center;
        line-height: 1.6;
        color: rgba(255,255,255,0.55);
        font-size: 14px;
    }

    button {
        border: 0;
        padding: 14px 24px;
        border-radius: 999px;
        cursor: pointer;

        color: white;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;

        background: linear-gradient(
            100deg,
            #7c4dff,
            #ff3ec8
        );

        box-shadow:
            0 0 30px rgba(255, 65, 210, .3),
            0 10px 40px rgba(0,0,0,.4);

        transition: transform .2s ease;
    }

    button:hover {
        transform: translateY(-2px) scale(1.03);
    }

    .gesture {
        position: fixed;
        top: 70px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;

        font-size: 12px;
        letter-spacing: .16em;
        text-transform: uppercase;

        color: rgba(255,255,255,.65);

        opacity: 0;
        transition: opacity .25s ease;
    }

    .gesture.visible {
        opacity: 1;
    }
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div class="vignette"></div>

<div class="topbar">
    <div class="brand">NEON HAND / UNIVERSE</div>

    <div class="status">
        <span class="dot"></span>
        <span id="statusText">Waiting for camera</span>
    </div>
</div>

<div id="gestureText" class="gesture">
    OPEN HAND
</div>

<div class="instructions">
    MOVE • PINCH • FIST • PEACE • CREATE
</div>

<div id="startScreen" class="start">
    <h1>HAND<br>UNIVERSE</h1>

    <p>
        Turn your hand into a living particle system.
        Move your fingers, pinch, make a fist, or show a peace sign.
    </p>

    <button id="startButton">
        Enter the Universe
    </button>
</div>

<script type="module">

import {
    HandLandmarker,
    FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


// --------------------------------------------------
// SETUP
// --------------------------------------------------

const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");
const statusText = document.getElementById("statusText");
const gestureText = document.getElementById("gestureText");

let handLandmarker;
let stream;

let W = window.innerWidth;
let H = window.innerHeight;

canvas.width = W;
canvas.height = H;


// --------------------------------------------------
// PARTICLE SYSTEM
// --------------------------------------------------

const particles = [];
const trails = [];
const bursts = [];

const PARTICLE_COUNT = 850;

let hue = 280;
let visualMode = 0;

let hand = null;
let previousHand = null;

let pinchWasActive = false;
let fistWasActive = false;
let peaceWasActive = false;

let lastTime = performance.now();


// --------------------------------------------------
// UTILITY
// --------------------------------------------------

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
}


// --------------------------------------------------
// PARTICLES
// --------------------------------------------------

class Particle {

    constructor() {
        this.reset(true);
    }

    reset(initial = false) {

        this.x = random(0, W);
        this.y = random(0, H);

        if (initial) {
            this.vx = random(-0.25, 0.25);
            this.vy = random(-0.25, 0.25);
        } else {
            this.vx = random(-2, 2);
            this.vy = random(-2, 2);
        }

        this.size = random(0.5, 2.2);
        this.life = random(0.4, 1);
        this.phase = random(0, Math.PI * 2);
        this.orbit = random(0.2, 1.4);
    }

    update(dt) {

        this.phase += dt * this.orbit;

        // Floating cosmic motion
        this.vx += Math.cos(this.phase) * 0.003;
        this.vy += Math.sin(this.phase * 1.3) * 0.003;

        // Hand interaction
        if (hand) {

            const dx = hand.x - this.x;
            const dy = hand.y - this.y;

            const d = Math.hypot(dx, dy);

            if (d < 280) {

                const force = (1 - d / 280);

                // Open hand = gravitational field
                if (hand.gesture === "open") {

                    this.vx += dx / d * force * 0.09;
                    this.vy += dy / d * force * 0.09;

                }

                // Index finger = repulsive field
                if (hand.gesture === "point") {

                    this.vx -= dx / d * force * 0.12;
                    this.vy -= dy / d * force * 0.12;

                }

                // Pinch = strong attraction
                if (hand.gesture === "pinch") {

                    this.vx += dx / d * force * 0.3;
                    this.vy += dy / d * force * 0.3;
                }
            }
        }

        // Damping
        this.vx *= 0.985;
        this.vy *= 0.985;

        this.x += this.vx;
        this.y += this.vy;

        // Wrap screen
        if (this.x < -30) this.x = W + 30;
        if (this.x > W + 30) this.x = -30;

        if (this.y < -30) this.y = H + 30;
        if (this.y > H + 30) this.y = -30;
    }

    draw() {

        const alpha = 0.25 + this.life * 0.65;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `hsla(${hue + this.x * 0.03}, 100%, 75%, ${alpha})`;

        ctx.fill();
    }
}


for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push(new Particle());
}


// --------------------------------------------------
// BURST EFFECT
// --------------------------------------------------

function createBurst(x, y, amount = 100) {

    for (let i = 0; i < amount; i++) {

        const angle = Math.random() * Math.PI * 2;
        const speed = random(2, 12);

        bursts.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            size: random(1, 5)
        });
    }
}


function updateBursts() {

    for (let i = bursts.length - 1; i >= 0; i--) {

        const b = bursts[i];

        b.x += b.vx;
        b.y += b.vy;

        b.vx *= 0.96;
        b.vy *= 0.96;

        b.life -= 0.018;

        if (b.life <= 0) {
            bursts.splice(i, 1);
            continue;
        }

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.size * b.life,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `hsla(${hue + 80},100%,70%,${b.life})`;

        ctx.fill();
    }
}


// --------------------------------------------------
// TRAIL
// --------------------------------------------------

function addTrail(x, y) {

    trails.push({
        x,
        y,
        life: 1,
        size: random(2, 7)
    });

    if (trails.length > 220) {
        trails.shift();
    }
}


function drawTrails() {

    for (let i = trails.length - 1; i >= 0; i--) {

        const t = trails[i];

        t.life -= 0.025;

        if (t.life <= 0) {
            trails.splice(i, 1);
            continue;
        }

        ctx.beginPath();

        ctx.arc(
            t.x,
            t.y,
            t.size * t.life,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `hsla(${hue + 40},100%,70%,${t.life * 0.6})`;

        ctx.fill();
    }
}


// --------------------------------------------------
// GLOWING CONNECTIONS
// --------------------------------------------------

function drawConnections() {

    if (!hand) return;

    const fingers = [
        hand.index,
        hand.middle,
        hand.ring,
        hand.pinky
    ];

    for (const p of fingers) {

        const dx = p.x - hand.x;
        const dy = p.y - hand.y;

        const d = Math.hypot(dx, dy);

        if (d < 500) {

            const gradient = ctx.createLinearGradient(
                hand.x,
                hand.y,
                p.x,
                p.y
            );

            gradient.addColorStop(
                0,
                `hsla(${hue},100%,70%,0.35)`
            );

            gradient.addColorStop(
                1,
                `hsla(${hue + 80},100%,70%,0)`
            );

            ctx.beginPath();

            ctx.moveTo(hand.x, hand.y);
            ctx.lineTo(p.x, p.y);

            ctx.strokeStyle = gradient;
            ctx.lineWidth = 1;

            ctx.stroke();
        }
    }
}


// --------------------------------------------------
// HAND CURSOR
// --------------------------------------------------

function drawHandCursor() {

    if (!hand) return;

    const radius =
        hand.gesture === "pinch" ? 32 :
        hand.gesture === "fist" ? 45 :
        22;

    // Outer glow
    const gradient = ctx.createRadialGradient(
        hand.x,
        hand.y,
        0,
        hand.x,
        hand.y,
        radius * 3
    );

    gradient.addColorStop(
        0,
        `hsla(${hue},100%,70%,0.45)`
    );

    gradient.addColorStop(
        0.4,
        `hsla(${hue + 50},100%,60%,0.12)`
    );

    gradient.addColorStop(
        1,
        `hsla(${hue},100%,50%,0)`
    );

    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.arc(
        hand.x,
        hand.y,
        radius * 3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Main ring
    ctx.beginPath();

    ctx.arc(
        hand.x,
        hand.y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        `hsla(${hue},100%,80%,0.8)`;

    ctx.lineWidth = 1.5;

    ctx.stroke();


    // Core
    ctx.beginPath();

    ctx.arc(
        hand.x,
        hand.y,
        4,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#ffffff";
    ctx.shadowBlur = 20;
    ctx.shadowColor = `hsl(${hue},100%,70%)`;

    ctx.fill();

    ctx.shadowBlur = 0;
}


// --------------------------------------------------
// GESTURE DETECTION
// --------------------------------------------------

function isFingerExtended(points, tip, pip) {

    const wrist = points[0];

    const tipDistance =
        distance(points[tip], wrist);

    const pipDistance =
        distance(points[pip], wrist);

    return tipDistance > pipDistance * 1.15;
}


function detectGesture(points) {

    const index =
        isFingerExtended(points, 8, 6);

    const middle =
        isFingerExtended(points, 12, 10);

    const ring =
        isFingerExtended(points, 16, 14);

    const pinky =
        isFingerExtended(points, 20, 18);


    // Pinch
    const pinchDistance =
        distance(points[4], points[8]);

    if (pinchDistance < 0.055) {
        return "pinch";
    }


    // Fist
    if (!index && !middle && !ring && !pinky) {
        return "fist";
    }


    // Peace sign
    if (index && middle && !ring && !pinky) {
        return "peace";
    }


    // Pointing
    if (index && !middle && !ring && !pinky) {
        return "point";
    }


    // Open hand
    if (index && middle && ring && pinky) {
        return "open";
    }


    return "idle";
}


// --------------------------------------------------
// CONVERT MEDIAPIPE LANDMARKS
// --------------------------------------------------

function processHand(result) {

    if (!result.landmarks || result.landmarks.length === 0) {

        hand = null;
        gestureText.classList.remove("visible");

        return;
    }

    const points = result.landmarks[0];


    // Mirror coordinates to match mirrored video
    function convert(p) {

        return {
            x: (1 - p.x) * W,
            y: p.y * H
        };
    }


    const wrist = convert(points[0]);

    const index = convert(points[8]);
    const middle = convert(points[12]);
    const ring = convert(points[16]);
    const pinky = convert(points[20]);

    const thumb = convert(points[4]);


    const center = {
        x: (
            wrist.x +
            index.x +
            middle.x +
            ring.x +
            pinky.x
        ) / 5,

        y: (
            wrist.y +
            index.y +
            middle.y +
            ring.y +
            pinky.y
        ) / 5
    };


    const gesture = detectGesture(points);


    hand = {
        x: index.x,
        y: index.y,

        centerX: center.x,
        centerY: center.y,

        wrist,
        index,
        middle,
        ring,
        pinky,
        thumb,

        gesture
    };


    // Gesture UI
    gestureText.textContent =
        gesture.toUpperCase();

    gestureText.classList.add("visible");


    // Hue changes with hand movement
    hue =
        240 +
        (index.x / W) * 180;


    // Add trail while pointing
    if (
        gesture === "point" ||
        gesture === "pinch"
    ) {
        addTrail(index.x, index.y);
    }


    // Pinch burst
    if (
        gesture === "pinch" &&
        !pinchWasActive
    ) {

        createBurst(
            index.x,
            index.y,
            75
        );
    }

    pinchWasActive =
        gesture === "pinch";


    // Fist burst
    if (
        gesture === "fist" &&
        !fistWasActive
    ) {

        createBurst(
            center.x,
            center.y,
            180
        );
    }

    fistWasActive =
        gesture === "fist";


    // Peace sign = change universe
    if (
        gesture === "peace" &&
        !peaceWasActive
    ) {

        visualMode++;

        hue += 90;

        createBurst(
            center.x,
            center.y,
            120
        );
    }

    peaceWasActive =
        gesture === "peace";


    previousHand = hand;
}


// --------------------------------------------------
// BACKGROUND
// --------------------------------------------------

function drawBackground(time) {

    const gradient = ctx.createRadialGradient(
        W * 0.5,
        H * 0.5,
        0,
        W * 0.5,
        H * 0.5,
        Math.max(W, H)
    );

    const shift =
        Math.sin(time * 0.0003) * 100;

    gradient.addColorStop(
        0,
        `hsla(${hue + shift},60%,12%,1)`
    );

    gradient.addColorStop(
        0.5,
        `hsla(${hue + 80},55%,6%,1)`
    );

    gradient.addColorStop(
        1,
        "#020208"
    );

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);
}


// --------------------------------------------------
// CAMERA / MEDIAPIPE
// --------------------------------------------------

async function setupHandTracking() {

    statusText.textContent =
        "Loading AI...";

    const vision =
        await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );


    handLandmarker =
        await HandLandmarker.createFromOptions(
            vision,
            {
                baseOptions: {
                    modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                    delegate: "GPU"
                },

                runningMode: "VIDEO",

                numHands: 1,

                minHandDetectionConfidence: 0.5,

                minHandPresenceConfidence: 0.5,

                minTrackingConfidence: 0.5
            }
        );


    statusText.textContent =
        "Starting camera...";


    stream =
        await navigator.mediaDevices.getUserMedia({
            video: {
                width: {
                    ideal: 1280
                },

                height: {
                    ideal: 720
                },

                facingMode: "user"
            },

            audio: false
        });


    video.srcObject = stream;

    await video.play();


    statusText.textContent =
        "Hand tracking active";


    startScreen.classList.add("hidden");


    requestAnimationFrame(render);
}


// --------------------------------------------------
// TRACK HAND
// --------------------------------------------------

let lastVideoTime = -1;

function trackHand() {

    if (
        !handLandmarker ||
        video.readyState < 2
    ) {
        return;
    }


    if (video.currentTime !== lastVideoTime) {

        const result =
            handLandmarker.detectForVideo(
                video,
                performance.now()
            );

        processHand(result);

        lastVideoTime =
            video.currentTime;
    }
}


// --------------------------------------------------
// MAIN RENDER LOOP
// --------------------------------------------------

function render(time) {

    const dt =
        Math.min(
            (time - lastTime) / 16.67,
            3
        );

    lastTime = time;


    trackHand();


    drawBackground(time);


    // Slight particle blur/glow layer
    ctx.save();

    ctx.globalCompositeOperation =
        "lighter";


    // Particles
    for (const p of particles) {

        p.update(dt);
        p.draw();
    }


    // Trails
    drawTrails();


    // Hand geometry
    drawConnections();


    // Burst particles
    updateBursts();


    // Cursor
    drawHandCursor();


    ctx.restore();


    requestAnimationFrame(render);
}


// --------------------------------------------------
// RESIZE
// --------------------------------------------------

window.addEventListener(
    "resize",
    () => {

        W = window.innerWidth;
        H = window.innerHeight;

        canvas.width = W;
        canvas.height = H;
    }
);


// --------------------------------------------------
// START
// --------------------------------------------------

startButton.addEventListener(
    "click",
    async () => {

        try {

            await setupHandTracking();

        } catch (error) {

            console.error(error);

            statusText.textContent =
                "Camera permission required";

            alert(
                "Could not start the camera. " +
                "Please allow camera access and reload the page."
            );
        }
    }
);

</script>

</body>
</html>
